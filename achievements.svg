<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000"/>
      <stop offset="50%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#001020"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b8860b"/>
      <stop offset="50%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>

    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6c757d"/>
      <stop offset="50%" style="stop-color:#c0c0c0"/>
      <stop offset="100%" style="stop-color:#6c757d"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0077aa"/>
      <stop offset="50%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0077aa"/>
    </linearGradient>

    <linearGradient id="card1Stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#ffd700;stop-opacity:0.8"/>
      <stop offset="70%" style="stop-color:#ffd700;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0"/>
    </linearGradient>

    <linearGradient id="card2Stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c0c0c0;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#c0c0c0;stop-opacity:0.8"/>
      <stop offset="70%" style="stop-color:#c0c0c0;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#c0c0c0;stop-opacity:0"/>
    </linearGradient>

    <linearGradient id="card3Stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#00d4ff;stop-opacity:0.8"/>
      <stop offset="70%" style="stop-color:#00d4ff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0"/>
    </linearGradient>

    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="silverGlow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cyanGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="titleGlow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="320" fill="url(#bg)"/>

  <line x1="0" y1="1" x2="900" y2="1" stroke="#00d4ff" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="319" x2="900" y2="319" stroke="#00d4ff" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4s" begin="2s" repeatCount="indefinite"/>
  </line>

  <g opacity="0.05" stroke="#00d4ff" stroke-width="0.5">
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="225" y1="0" x2="225" y2="320"/>
    <line x1="450" y1="0" x2="450" y2="320"/>
    <line x1="675" y1="0" x2="675" y2="320"/>
  </g>

  <text x="450" y="44" text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="13"
    letter-spacing="8" fill="#00d4ff" filter="url(#titleGlow)" opacity="0">
    ◆  ACHIEVEMENTS  ◆
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.2s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0.7;1" dur="3s" begin="0.8s" repeatCount="indefinite"/>
  </text>

  <line x1="130" y1="44" x2="320" y2="44" stroke="#00d4ff" stroke-width="0.5" opacity="0">
    <animate attributeName="opacity" values="0;0.5" dur="0.5s" begin="0.5s" fill="freeze"/>
  </line>
  <line x1="580" y1="44" x2="770" y2="44" stroke="#00d4ff" stroke-width="0.5" opacity="0">
    <animate attributeName="opacity" values="0;0.5" dur="0.5s" begin="0.5s" fill="freeze"/>
  </line>

  <!-- ═══ CARD 1 — GOLD ═══ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.4s" fill="freeze"/>

    <rect x="20" y="66" width="265" height="110" rx="10"
      fill="#0a0c10" stroke="url(#card1Stroke)" stroke-width="1"/>

    <rect x="20" y="66" width="4" height="110" rx="2" fill="url(#goldGrad)" opacity="0.9"/>

    <circle cx="55" cy="101" r="20" fill="#1a1500" stroke="#ffd700" stroke-width="1.5" opacity="0.9" filter="url(#goldGlow)"/>
    <text x="55" y="107" text-anchor="middle"
      font-family="Arial" font-size="20" fill="#ffd700">🥇</text>

    <text x="85" y="95" font-family="'Segoe UI', Arial, sans-serif" font-weight="700"
      font-size="13" fill="#ffd700" filter="url(#goldGlow)">TOP 5  /  120 TEAMS</text>

    <text x="85" y="113" font-family="'Segoe UI', Arial, sans-serif" font-weight="400"
      font-size="11" fill="#e0e0e0">Hackbyte 3.0 Hackathon</text>

    <text x="85" y="129" font-family="'Fira Code', monospace" font-size="10"
      fill="#888888">IIITDM Jabalpur</text>

    <rect x="85" y="143" width="110" height="18" rx="9" fill="#1a1200" stroke="#ffd700" stroke-width="0.8" opacity="0.8"/>
    <text x="140" y="155" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
      font-size="9" letter-spacing="1" fill="#ffd700">HACKATHON  ·  2024</text>
  </g>

  <!-- ═══ CARD 2 — SILVER ═══ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.7s" fill="freeze"/>

    <rect x="317" y="66" width="265" height="110" rx="10"
      fill="#0a0c10" stroke="url(#card2Stroke)" stroke-width="1"/>

    <rect x="317" y="66" width="4" height="110" rx="2" fill="url(#silverGrad)" opacity="0.9"/>

    <circle cx="352" cy="101" r="20" fill="#0e0f0e" stroke="#c0c0c0" stroke-width="1.5" opacity="0.9" filter="url(#silverGlow)"/>
    <text x="352" y="107" text-anchor="middle"
      font-family="Arial" font-size="20" fill="#c0c0c0">🏅</text>

    <text x="382" y="95" font-family="'Segoe UI', Arial, sans-serif" font-weight="700"
      font-size="13" fill="#c0c0c0" filter="url(#silverGlow)">TOP 10  FINALIST</text>

    <text x="382" y="113" font-family="'Segoe UI', Arial, sans-serif" font-weight="400"
      font-size="11" fill="#e0e0e0">Workato AI Automation</text>

    <text x="382" y="129" font-family="'Fira Code', monospace" font-size="10"
      fill="#888888">National-Level Challenge</text>

    <rect x="382" y="143" width="126" height="18" rx="9" fill="#101010" stroke="#c0c0c0" stroke-width="0.8" opacity="0.8"/>
    <text x="445" y="155" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
      font-size="9" letter-spacing="1" fill="#c0c0c0">AI AUTOMATION  ·  2024</text>
  </g>

  <!-- ═══ CARD 3 — CYAN ═══ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.0s" fill="freeze"/>

    <rect x="614" y="66" width="265" height="110" rx="10"
      fill="#0a0c10" stroke="url(#card3Stroke)" stroke-width="1"/>

    <rect x="614" y="66" width="4" height="110" rx="2" fill="url(#cyanGrad)" opacity="0.9"/>

    <circle cx="649" cy="101" r="20" fill="#001a22" stroke="#00d4ff" stroke-width="1.5" opacity="0.9" filter="url(#cyanGlow)"/>
    <text x="649" y="107" text-anchor="middle"
      font-family="Arial" font-size="20" fill="#00d4ff">🎮</text>

    <text x="679" y="95" font-family="'Segoe UI', Arial, sans-serif" font-weight="700"
      font-size="13" fill="#00d4ff" filter="url(#cyanGlow)">ESPORTS  CHAMPION</text>

    <text x="679" y="113" font-family="'Segoe UI', Arial, sans-serif" font-weight="400"
      font-size="11" fill="#e0e0e0">Multiple Tournament Winner</text>

    <text x="679" y="129" font-family="'Fira Code', monospace" font-size="10"
      fill="#888888">IIM Vizag · Sambalpur · IIITN</text>

    <rect x="679" y="143" width="110" height="18" rx="9" fill="#001520" stroke="#00d4ff" stroke-width="0.8" opacity="0.8"/>
    <text x="734" y="155" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
      font-size="9" letter-spacing="1" fill="#00d4ff">GAMING  ·  MULTI-INST</text>
  </g>

  <!-- ═══ STAT PILLS ROW ═══ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.4s" fill="freeze"/>

    <rect x="20" y="200" width="860" height="1" fill="#00d4ff" opacity="0.12"/>

    <rect x="155" y="218" width="180" height="36" rx="18" fill="#0d0f14" stroke="#ffd700" stroke-width="0.8"/>
    <text x="245" y="234" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
      font-weight="700" font-size="16" fill="#ffd700" filter="url(#goldGlow)">120</text>
    <text x="245" y="247" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
      font-size="9" letter-spacing="1" fill="#888">TEAMS COMPETED</text>

    <rect x="360" y="218" width="180" height="36" rx="18" fill="#0d0f14" stroke="#c0c0c0" stroke-width="0.8"/>
    <text x="450" y="234" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
      font-weight="700" font-size="16" fill="#c0c0c0" filter="url(#silverGlow)">3+</text>
    <text x="450" y="247" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
      font-size="9" letter-spacing="1" fill="#888">HACKATHONS</text>

    <rect x="565" y="218" width="180" height="36" rx="18" fill="#0d0f14" stroke="#00d4ff" stroke-width="0.8"/>
    <text x="655" y="234" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
      font-weight="700" font-size="16" fill="#00d4ff" filter="url(#cyanGlow)">3+</text>
    <text x="655" y="247" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
      font-size="9" letter-spacing="1" fill="#888">ESPORTS TITLES</text>
  </g>

  <!-- ═══ BOTTOM TICKER ═══ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.8s" fill="freeze"/>

    <rect x="0" y="274" width="900" height="46" fill="#030507" opacity="0.95"/>
    <line x1="0" y1="274" x2="900" y2="274" stroke="#00d4ff" stroke-width="0.5" opacity="0.3"/>

    <text y="303" font-family="'Fira Code', monospace" font-size="11" letter-spacing="3" fill="#00d4ff" opacity="0.7">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/>
      <tspan x="900">
        <animate attributeName="x" values="900;-1200" dur="14s" repeatCount="indefinite" calcMode="linear"/>
        ◈  TOP 5 · HACKBYTE 3.0  ·  IIITDM JABALPUR    ◈  TOP 10 · WORKATO AI HACKATHON    ◈  ESPORTS CHAMPION · IIM VIZAG · SAMBALPUR · IIIT NAGPUR    ◈  IEEE PUBLISHED RESEARCHER    ◈  AI ENGINEER · IIM MBA
      </tspan>
    </text>
  </g>

  <!-- corner brackets -->
  <g stroke="#ffd700" stroke-width="1.5" fill="none" opacity="0">
    <polyline points="10,10 10,26 26,10"/>
    <animate attributeName="opacity" values="0;0.6" dur="0.4s" begin="0.1s" fill="freeze"/>
  </g>
  <g stroke="#ffd700" stroke-width="1.5" fill="none" opacity="0">
    <polyline points="890,10 890,26 874,10"/>
    <animate attributeName="opacity" values="0;0.6" dur="0.4s" begin="0.2s" fill="freeze"/>
  </g>
  <g stroke="#00d4ff" stroke-width="1.5" fill="none" opacity="0">
    <polyline points="10,310 10,294 26,310"/>
    <animate attributeName="opacity" values="0;0.6" dur="0.4s" begin="0.3s" fill="freeze"/>
  </g>
  <g stroke="#00d4ff" stroke-width="1.5" fill="none" opacity="0">
    <polyline points="890,310 890,294 874,310"/>
    <animate attributeName="opacity" values="0;0.6" dur="0.4s" begin="0.4s" fill="freeze"/>
  </g>

</svg>
